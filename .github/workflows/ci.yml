name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor and the current release. The floor is what the metadata
        # promises, and nothing else here would notice it being broken.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The parser model is not a dependency, because PyPI rejects direct URLs,
      # so it is installed the same way a user installs it.
      - run: cadence download-model
      - run: ruff check .
      - run: pytest -q
