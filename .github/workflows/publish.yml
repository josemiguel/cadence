name: Publish to PyPI

# Publishing is a tag, not a push. Tagging v0.1.0 builds the distribution and
# hands it to PyPI through Trusted Publishing: PyPI verifies GitHub's identity
# token for this repository, this workflow and this environment, so there is no
# API token to store, rotate or leak.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment name is part of what PyPI verifies. It must match the
    # trusted publisher registered on pypi.org exactly.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
